<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5b4cf0">
  <meta name="robots" content="noindex, nofollow">
  <title>Inglés para todos</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Instalar en el celular como app (manifest.webmanifest) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="images/app/icon-192.png">
  <link rel="apple-touch-icon" href="images/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Inglés">
  <!-- Pantalla de bienvenida: cae una gota de agua y hace ondas; de ahí salen el globo de diálogo y las banderas, y después el nombre de la app (se quita sola) -->
  <style>
    .splash { position: fixed; inset: 0; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #9b6cf7 0%, #5b4cf0 45%, #21175f 100%); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; transition: opacity .55s ease, transform .55s ease; overflow: hidden; }
    .splash.fuera { opacity: 0; transform: scale(1.06); pointer-events: none; }
    .splash-logo { position: relative; width: 210px; height: 210px; animation: sp-emerge 1s cubic-bezier(.2, 1.4, .4, 1) .4s both; }
    .splash-logo::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .55);
      animation: sp-onda 1.6s ease-out .75s both; }
    .splash-logo svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 22px rgba(20, 10, 70, .5)); }
    .sp-centro { transform-origin: 256px 346px; animation: sp-crece .7s cubic-bezier(.3, 1.5, .5, 1) .65s both; }
    .sp-izq { transform-origin: 256px 346px; animation: sp-izq .75s cubic-bezier(.3, 1.4, .5, 1) .9s both; }
    .sp-der { transform-origin: 256px 346px; animation: sp-der .75s cubic-bezier(.3, 1.4, .5, 1) .9s both; }
    /* Destello de luz cuando la estrella llega al globo de diálogo */
    .sp-luz { transform-origin: 256px 110px; animation: sp-luz 1.1s ease-out 2.05s both; }
    .sp-rayos { transform-origin: 256px 110px; animation: sp-rayos 1s ease-out 2.1s both; }
    .sp-chispas { transform-origin: 256px 110px; animation: sp-chispas 1.2s ease-out 2.15s both; }
    .splash::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255, 244, 205, .55), rgba(255, 244, 205, 0) 60%); animation: sp-brillo 1s ease-out 2.08s both; }
    @keyframes sp-luz { 0% { transform: scale(0); opacity: 0; } 25% { opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes sp-rayos { 0% { transform: scale(.3) rotate(-15deg); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.6) rotate(20deg); opacity: 0; } }
    @keyframes sp-chispas { 0% { transform: scale(.2); opacity: 0; } 35% { opacity: 1; } 100% { transform: scale(1.5) rotate(30deg); opacity: 0; } }
    @keyframes sp-brillo { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
    .sp-estrella { transform-origin: 256px 110px; animation: sp-estrella .8s cubic-bezier(.3, 1.6, .5, 1) 1.4s both, sp-brilla 1.4s ease-in-out 2.2s infinite; }
    .splash-nombre { margin-top: 6px; text-align: center; }
    .splash-nombre b { display: block; font-size: 30px; font-weight: 800; letter-spacing: .5px; animation: sp-texto .7s ease-out 1.75s both; }
    .splash-nombre span { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; letter-spacing: 6px; text-transform: uppercase; color: #ffd76a;
      animation: sp-texto .7s ease-out 2s both; }
    .splash-linea { width: 0; height: 2px; margin: 14px auto 0; border-radius: 2px; background: #f2c96b; animation: sp-linea .8s ease-out 2.25s both; }
    /* Gota de agua: cae al centro del globo de diálogo y abre ondas que cruzan la pantalla */
    .splash-agua { position: absolute; left: 50%; top: calc(50% - 43px); width: 0; height: 0; pointer-events: none; }
    .sp-gota { position: absolute; left: -12px; top: -38px; width: 24px; height: 34px; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
      background: radial-gradient(circle at 35% 62%, #e8f6ff 0 14%, #6cc4f5 34%, #2a7fd0 78%); box-shadow: 0 0 14px rgba(170, 225, 255, .75);
      animation: sp-cae .42s cubic-bezier(.55, 0, 1, .45) both; }
    .sp-anillo { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; border-radius: 50%; opacity: 0;
      border: 2px solid rgba(255, 240, 205, .85); box-shadow: 0 0 10px rgba(255, 225, 165, .55), inset 0 0 12px rgba(255, 225, 165, .45);
      animation: sp-anillo 2s cubic-bezier(.2, .6, .35, 1) .42s both; }
    .sp-anillo:nth-child(4) { animation-delay: .62s; border-width: 3px; }
    .sp-anillo:nth-child(5) { animation-delay: .84s; }
    .sp-anillo:nth-child(6) { animation-delay: 1.08s; border-width: 1.5px; }
    .sp-salpica { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; opacity: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, .9), rgba(255, 225, 165, .35) 45%, rgba(255, 225, 165, 0) 70%);
      animation: sp-salpica .6s ease-out .4s both; }
    @keyframes sp-cae { 0% { transform: translateY(-60vh) scaleY(1.3); opacity: 0; } 15% { opacity: 1; } 90% { transform: translateY(0) scaleY(1.15); opacity: 1; }
      100% { transform: translateY(6px) scale(1.6, .3); opacity: 0; } }
    @keyframes sp-anillo { 0% { transform: scale(.08); opacity: 0; } 12% { opacity: .95; } 100% { transform: scale(9); opacity: 0; } }
    @keyframes sp-salpica { 0% { transform: scale(.2); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
    @keyframes sp-emerge { from { transform: translateY(40px) scale(.4); opacity: 0; } }
    @keyframes sp-onda { 0% { transform: scale(.6); opacity: 0; } 30% { opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes sp-crece { from { transform: scaleY(0); opacity: 0; } }
    @keyframes sp-izq { from { transform: rotate(40deg) scale(.6); opacity: 0; } }
    @keyframes sp-der { from { transform: rotate(-40deg) scale(.6); opacity: 0; } }
    @keyframes sp-estrella { from { transform: translateY(-90px) rotate(-180deg) scale(0); opacity: 0; } }
    @keyframes sp-brilla { 50% { filter: drop-shadow(0 0 14px #ffe39a) drop-shadow(0 0 4px #fff); } }
    @keyframes sp-texto { from { transform: translateY(16px); opacity: 0; } }
    @keyframes sp-linea { to { width: 120px; } }
    @media (prefers-reduced-motion: reduce) { .splash-agua { display: none; } .splash *, .splash *::before { animation-duration: .01s !important; animation-delay: 0s !important; } }
  </style>
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <div class="splash-agua"><span class="sp-gota"></span><span class="sp-salpica"></span><span class="sp-anillo"></span><span class="sp-anillo"></span><span class="sp-anillo"></span><span class="sp-anillo"></span></div>
    <div class="splash-logo">
      <svg viewBox="0 0 512 512">
        <defs>
          <radialGradient id="sp-luz"><stop offset="0" stop-color="#fffbe8"/><stop offset=".35" stop-color="#ffe7a3" stop-opacity=".85"/><stop offset="1" stop-color="#ffe39a" stop-opacity="0"/></radialGradient>
          <clipPath id="sp-c1"><circle cx="82" cy="356" r="58"/></clipPath>
          <clipPath id="sp-c2"><circle cx="430" cy="356" r="58"/></clipPath>
        </defs>
        <!-- Globo de diálogo -->
        <g class="sp-centro">
          <path fill="#fff" d="M136 164h240a48 48 0 0 1 48 48v92a48 48 0 0 1-48 48h-82l-44 50v-50h-114a48 48 0 0 1-48-48v-92a48 48 0 0 1 48-48z"/>
          <text x="256" y="284" text-anchor="middle" font-size="78" font-weight="800" fill="#5b4cf0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Hello!</text>
        </g>
        <!-- Bandera de Estados Unidos -->
        <g class="sp-izq">
          <g clip-path="url(#sp-c1)">
            <rect x="24" y="298" width="116" height="116" fill="#fff"/>
            <path fill="#d62839" d="M24 298h116v13H24zM24 324h116v13H24zM24 350h116v13H24zM24 376h116v13H24zM24 402h116v13H24z"/>
            <rect x="24" y="298" width="58" height="52" fill="#27408b"/>
            <g fill="#fff"><circle cx="40" cy="313" r="3.5"/><circle cx="56" cy="313" r="3.5"/><circle cx="72" cy="313" r="3.5"/><circle cx="48" cy="326" r="3.5"/><circle cx="64" cy="326" r="3.5"/><circle cx="40" cy="339" r="3.5"/><circle cx="56" cy="339" r="3.5"/><circle cx="72" cy="339" r="3.5"/></g>
          </g>
          <circle cx="82" cy="356" r="58" fill="none" stroke="#fff" stroke-width="7"/>
        </g>
        <!-- Bandera del Reino Unido -->
        <g class="sp-der">
          <g clip-path="url(#sp-c2)">
            <rect x="372" y="298" width="116" height="116" fill="#27408b"/>
            <path stroke="#fff" stroke-width="20" d="M372 298l116 116M488 298L372 414"/>
            <path stroke="#d62839" stroke-width="8" d="M372 298l116 116M488 298L372 414"/>
            <path stroke="#fff" stroke-width="32" d="M430 298v116M372 356h116"/>
            <path stroke="#d62839" stroke-width="18" d="M430 298v116M372 356h116"/>
          </g>
          <circle cx="430" cy="356" r="58" fill="none" stroke="#fff" stroke-width="7"/>
        </g>
        <circle class="sp-luz" cx="256" cy="110" r="130" fill="url(#sp-luz)"/>
        <g class="sp-rayos" stroke="#fff1bd" stroke-width="7" stroke-linecap="round"><line x1="304" y1="110" x2="352" y2="110"/><line x1="298" y1="134" x2="322" y2="148"/><line x1="214" y1="134" x2="190" y2="148"/><line x1="208" y1="110" x2="160" y2="110"/><line x1="214" y1="86" x2="190" y2="72"/><line x1="232" y1="68" x2="208" y2="27"/><line x1="256" y1="62" x2="256" y2="34"/><line x1="280" y1="68" x2="304" y2="27"/><line x1="298" y1="86" x2="322" y2="72"/></g>
        <g class="sp-chispas" fill="#fff6d2"><circle cx="367" cy="130" r="6"/><circle cx="128" cy="89" r="4"/><circle cx="243" cy="-4" r="6"/><circle cx="334" cy="47" r="4"/><circle cx="150" cy="140" r="5"/></g>
        <path class="sp-estrella" d="M256 70l13 27 30 4-22 21 5 30-26-14-26 14 5-30-22-21 30-4z" fill="#ffd76a"/>
      </svg>
    </div>
    <div class="splash-nombre"><b>Inglés para todos</b><div class="splash-linea"></div></div>
  </div>
  <script>
    // Se quita sola a los 3.7 s (o al tocarla).
    (function () {
      var s = document.getElementById("splash"), listo = false;
      function quitar() { if (listo) return; listo = true; s.classList.add("fuera"); setTimeout(function () { s.remove(); }, 600); }
      s.addEventListener("click", quitar);
      setTimeout(quitar, 3700);
    })();
  </script>
  <main id="app" class="container"></main>

  <!-- Preguntas del examen de ubicación -->
  <script src="js/ubicacion.js"></script>
  <!-- Temas de cada nivel -->
  <script src="js/temas-a1.js"></script>
  <!-- Imágenes del vocabulario (scripts/importar_imagenes_canva.py) -->
  <script src="js/imagenes.js"></script>
  <!-- Índice de audios grabados (scripts/generar_audios.py) -->
  <script src="js/audio-base.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
